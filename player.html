<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BlackShore Player</title>
</head>
<body>
<audio id="player" loop preload="none"></audio>
<script>
(function(){
  var audio = document.getElementById('player');
  var currentSrc = '';
  var savedTime = 0;
  var STORAGE_KEY = 'bs_player';

  // 恢复保存的进度
  (function restoreTime(){
    try{
      var s = sessionStorage.getItem(STORAGE_KEY);
      if(s){ var d = JSON.parse(s); savedTime = d.time || 0; }
    }catch(ex){}
  })();

  // 处理来自主页面的消息
  window.addEventListener('message', function(e) {
    var d = e.data;
    if (!d || !d.type) return;

    switch (d.type) {
      case 'setSrc':
        var isSameSrc = (d.src === currentSrc);
        if (!isSameSrc) {
          // 换曲子才需要重新加载，保留进度
          savedTime = 0;
          currentSrc = d.src;
          audio.src = d.src;
          audio.load();
          console.log('[player] src set:', d.src, 'time reset');
        } else if (audio.readyState > 0 && savedTime > 0) {
          // 同曲子，恢复播放位置
          audio.currentTime = savedTime;
          console.log('[player] time restored:', savedTime);
        }
        break;
      case 'play':
        audio.play().catch(function(err){ console.error('[player] play err:', err); });
        break;
      case 'pause':
        audio.pause();
        break;
      case 'toggle':
        if (audio.paused) {
          audio.play().catch(function(err){ console.error('[player] play err:', err); });
        } else {
          audio.pause();
        }
        break;
      case 'getState':
        window.parent.postMessage({
          type: 'state',
          playing: !audio.paused,
          src: currentSrc,
          musicTitle: d.musicTitle || ''
        }, '*');
        break;
    }
  });

  // 保存播放进度
  audio.addEventListener('timeupdate', function() {
    if (audio.duration > 0 && !audio.paused) {
      savedTime = audio.currentTime;
      try { sessionStorage.setItem(STORAGE_KEY, JSON.stringify({src: currentSrc, time: savedTime})); } catch(ex){}
    }
  });

  // 状态变化时主动通知主页面
  audio.addEventListener('play', function() {
    window.parent.postMessage({ type: 'playing', playing: true }, '*');
  });
  audio.addEventListener('pause', function() {
    window.parent.postMessage({ type: 'playing', playing: false }, '*');
  });
  audio.addEventListener('error', function(e) {
    console.error('[player] audio error:', audio.error);
    window.parent.postMessage({ type: 'error', error: audio.error ? audio.error.message : 'unknown' }, '*');
  });

  // 初始化完成
  window.parent.postMessage({ type: 'ready' }, '*');
})();
</script>
</body>
</html>
