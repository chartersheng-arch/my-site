<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BlackShore Player</title>
</head>
<body>
<audio id="player" loop preload="none"></audio>
<script>
(function(){
  var audio = document.getElementById('player');
  var currentSrc = '';
  var STORAGE_KEY = '***';

  // 保存进度到 sessionStorage（跨 iframe 共享）
  function saveProgress(){
    if(audio.duration > 0){
      var time = audio.currentTime;
      try{
        sessionStorage.setItem(STORAGE_KEY, JSON.stringify({
          src: currentSrc,
          time: time,
          playing: !audio.paused
        }));
      }catch(ex){}
      // 通知父页面已保存
      window.parent.postMessage({type: 'progressSaved', time: time}, '*');
    }
  }

  window.addEventListener('message', function(e) {
    var d = e.data;
    if (!d || !d.type) return;

    switch (d.type) {
      case 'setSrc':
        var newTime = (d.time > 0) ? d.time : 0;
        if (d.src !== currentSrc) {
          // 换曲子，重置时间
          currentSrc = d.src;
          audio.src = d.src;
          audio.load();
          newTime = 0;
          console.log('[player] new src:', d.src);
        }
        // 等 canplay 后设置时间
        if (newTime > 0) {
          audio.addEventListener('canplay', function handler(){
            audio.removeEventListener('canplay', handler);
            audio.currentTime = newTime;
            console.log('[player] time restored to:', newTime);
          });
        }
        break;
      case 'play':
        audio.play().catch(function(err){ console.error('[player] play err:', err); });
        break;
      case 'pause':
        audio.pause();
        break;
      case 'toggle':
        if (audio.paused) {
          audio.play().catch(function(err){ console.error('[player] play err:', err); });
        } else {
          audio.pause();
        }
        break;
      case 'saveProgress':
        saveProgress();
        break;
      case 'getState':
        window.parent.postMessage({
          type: 'state',
          playing: !audio.paused,
          src: currentSrc
        }, '*');
        break;
    }
  });

  audio.addEventListener('play', function() {
    window.parent.postMessage({ type: 'playing', playing: true }, '*');
  });
  audio.addEventListener('pause', function() {
    window.parent.postMessage({ type: 'playing', playing: false }, '*');
    saveProgress();
  });
  audio.addEventListener('timeupdate', function() {
    // 节流：每 5 秒保存一次
    if (!saveProgress._last || Date.now() - saveProgress._last > 5000) {
      saveProgress._last = Date.now();
      saveProgress();
    }
  });
  audio.addEventListener('error', function(e) {
    console.error('[player] audio error:', audio.error);
    window.parent.postMessage({ type: 'error', error: audio.error ? audio.error.message : 'unknown' }, '*');
  });

  window.parent.postMessage({ type: 'ready' }, '*');
})();
</script>
</body>
</html>
